<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Voltix Settings</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Voltix Settings</div>
    <div class="controls">
      <a class="button-link" href="dashboard.html">Back to Dashboard</a>
    </div>
  </header>

  <main class="settings-page">
    <section class="panel settings-panel">
      <div class="section-head">
        <h3>Device Configuration</h3>
        <span id="settingsStatus">Loading...</span>
      </div>

      <div id="settingsMessage" class="status-message" aria-live="polite"></div>

      <form id="settingsForm" class="settings-form" novalidate>
        <label>
          Tariff
          <input id="tariff" type="number" step="0.0001" min="0.0001">
        </label>
        <label>
          Currency
          <input id="currency" type="text" autocomplete="off">
        </label>
        <label>
          Overload Threshold
          <input id="overloadThreshold" type="number" step="0.1" min="0.1">
        </label>
        <label>
          Overload Warning Percent
          <input id="overloadWarningPercent" type="number" step="1" min="1" max="100">
        </label>
        <label>
          Load Power Threshold
          <input id="loadPowerThreshold" type="number" step="0.01" min="0">
        </label>
        <label>
          Load Current Threshold
          <input id="loadCurrentThreshold" type="number" step="0.001" min="0">
        </label>
        <label>
          Load Removed Delay Sec
          <input id="loadRemovedDelaySec" type="number" step="1" min="1">
        </label>
        <label>
          Offline Timeout Sec
          <input id="offlineTimeoutSec" type="number" step="1" min="10">
        </label>
        <label>
          Checkpoint Interval Sec
          <input id="checkpointIntervalSec" type="number" step="1" min="5">
        </label>

        <div class="settings-actions">
          <button id="saveSettingsBtn" type="submit">Save Settings</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module">
    import './js/settings.js';
  </script>
</body>
</html>
